name: HarmoFin CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://harmofin_local:harmofin_local@localhost:5432/harmofin
      WEB_ORIGIN: http://localhost:3000
      WEB_BASE_URL: http://localhost:3000
      API_URL: http://localhost:3001
      API_PORT: 3001
      AUTH_TOKEN_HASH_SECRET: test-only-secret-with-at-least-32-bytes
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      MAIL_FROM: no-reply@harmofin.test
      SEED_DEMO_PASSWORD: local-demo-password-10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: harmofin
          POSTGRES_USER: harmofin_local
          POSTGRES_PASSWORD: harmofin_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harmofin_local -d harmofin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget -qO- http://localhost:8025/livez >/dev/null 2>&1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 5s

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migration to blank database
        run: pnpm db:migrate

      - name: Seed database twice
        run: pnpm db:seed && pnpm db:seed

      - name: Repeat migration on existing data
        run: pnpm db:migrate

      - name: Run unit tests
        run: pnpm test

      - name: Run integration tests
        run: pnpm test:integration

      - name: Build applications
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Validate local Compose configuration
        run: docker compose -f infra/compose/local.yml config --quiet

      - name: Validate production Compose configuration
        run: docker compose --env-file infra/env/staging.example -f infra/compose/production.yml config --quiet

      - name: Run production topology checks
        run: node --test infra/docker/production-topology.test.mjs

      - name: Run OpenAPI script unit tests
        run: node --test scripts/openapi/*.test.mjs scripts/ci/*.test.mjs

      - name: Generate OpenAPI document
        run: node scripts/openapi/generate.mjs openapi.head.json

      - name: Fetch main OpenAPI baseline
        run: git show origin/main:openapi.json > openapi.base.json || cp openapi.head.json openapi.base.json

      - name: Check OpenAPI contract
        run: node scripts/openapi/check.mjs openapi.head.json openapi.base.json

      - name: Run dependency security audit
        run: node scripts/ci/run-dependency-audit.mjs

      - name: Upload OpenAPI contract artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi-contract-${{ github.sha }}
          path: openapi.head.json
          retention-days: 30

  image-scan:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target: [web, api, worker, migrate]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          tags: harmofin-${{ matrix.target }}:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      # SBOM/vulnerability scanners are run as pinned-digest containers, not
      # marketplace Actions, after aquasecurity/trivy-action tags 0.0.1-0.34.2
      # were compromised to exfiltrate CI secrets (only 0.35.0+/SHA pins were safe).
      - name: Generate SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" \
            anchore/syft@sha256:b8c170b8e51bfc4779ec3ef4399942c57290f5ce76a9c3af564c9d00d4946a6b \
            harmofin-${{ matrix.target }}:${{ github.sha }} \
            -o spdx-json=/out/sbom-${{ matrix.target }}.spdx.json

      - name: Scan image for vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/scripts/ci/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy@sha256:26245f364b6f5d223003dc344ec1eb5eb8439052bfecb31d79aeba0c74344b3a \
            image --severity HIGH,CRITICAL --ignorefile /.trivyignore --exit-code 1 \
            harmofin-${{ matrix.target }}:${{ github.sha }}

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.target }}-${{ github.sha }}
          path: sbom-${{ matrix.target }}.spdx.json
          retention-days: 30

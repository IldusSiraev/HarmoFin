name: Publish images

on:
  workflow_run:
    workflows: [HarmoFin CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, api, worker, migrate]
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      REGISTRY: ghcr.io
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/harmofin-${{ matrix.target }}
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login "$REGISTRY" \
            --username '${{ github.actor }}' --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build and publish immutable image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=publish-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.target }}

      - name: Publish release metadata
        run: |
          printf '%s\n' \
            "image=${IMAGE_REPOSITORY}:${RELEASE_SHA}" \
            "revision=${RELEASE_SHA}" \
            "target=${{ matrix.target }}" > "release-${{ matrix.target }}-${RELEASE_SHA}.txt"

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}-${{ env.RELEASE_SHA }}
          path: release-${{ matrix.target }}-${{ env.RELEASE_SHA }}.txt
          retention-days: 30

name: Publish images

on:
  workflow_run:
    workflows: [HarmoFin CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, api, worker, migrate]
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      REGISTRY: ghcr.io
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set lowercase image repository
        run: |
          echo "IMAGE_REPOSITORY=ghcr.io/${OWNER,,}/harmofin-${{ matrix.target }}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Log in to GitHub Container Registry
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login "$REGISTRY" \
            --username '${{ github.actor }}' --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish immutable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Publish release metadata
        run: |
          printf '%s\n' \
            "image=${IMAGE_REPOSITORY}:${RELEASE_SHA}" \
            "revision=${RELEASE_SHA}" \
            "target=${{ matrix.target }}" > "release-${{ matrix.target }}-${RELEASE_SHA}.txt"

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}-${{ env.RELEASE_SHA }}
          path: release-${{ matrix.target }}-${{ env.RELEASE_SHA }}.txt
          retention-days: 30

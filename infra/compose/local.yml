services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-harmofin}
      POSTGRES_USER: ${POSTGRES_USER:-harmofin_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harmofin_local}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - harmofin-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8025/livez >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  harmofin-postgres-data:
